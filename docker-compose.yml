version: '3.8'

services:
  php:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      # ログはホストとのバインドマウントから外し、Dockerボリュームに置く。
      # Windowsのバインドマウント越しに追記し続けると稀に Permission denied となり、
      # Fuel::init() の段階で全エンドポイントが500になることがあるため。
      # 中身は docker compose -p freelance exec php tail -f fuel/app/logs/... で参照する。
      - fuel_logs:/var/www/html/fuel/app/logs
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: freelance_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  fuel_logs: