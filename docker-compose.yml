services:
  php:
    build: ./docker/php
    ports:
      - "8080:80"
    # DBの接続情報は環境変数でアプリに渡す。
    # アプリ側（fuel/app/config/db.php）はこの値を読むだけで、
    # 接続情報をコードに持たない。
    # 既定値はローカル開発用。別の環境で動かす場合は .env かシェルの
    # 環境変数で上書きする（例: DB_PASSWORD=xxx docker compose -p freelance up -d）
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-freelance_db}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./app:/var/www/html
      # ログはホストとのバインドマウントから外し、Dockerボリュームに置く。
      # Windowsのバインドマウント越しに追記し続けると稀に Permission denied となり、
      # Fuel::init() の段階で全エンドポイントが500になることがあるため。
      # 中身は docker compose -p freelance exec php tail -f fuel/app/logs/... で参照する。
      - fuel_logs:/var/www/html/fuel/app/logs
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-freelance_db}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  fuel_logs:
